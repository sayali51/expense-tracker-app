<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kharcha — Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #17171a;
    --surface2: #1f1f24;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0efe8;
    --muted: #7a7a82;
    --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.12);
    --red: #ff5f5f;
    --red-dim: rgba(255,95,95,0.1);
    --food: #c8f060;       --food-dim: rgba(200,240,96,0.15);
    --transport: #60c8f0;  --transport-dim: rgba(96,200,240,0.15);
    --shopping: #f0a060;   --shopping-dim: rgba(240,160,96,0.15);
    --health: #c060f0;     --health-dim: rgba(192,96,240,0.15);
    --entertainment: #f060a0; --entertainment-dim: rgba(240,96,160,0.15);
    --other: #808090;      --other-dim: rgba(128,128,144,0.15);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── DEMO BANNER ── */
  .demo-banner {
    background: linear-gradient(90deg, rgba(200,240,96,0.12) 0%, rgba(200,240,96,0.06) 100%);
    border-bottom: 1px solid rgba(200,240,96,0.25);
    padding: 10px 24px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 13px; color: var(--accent);
  }
  .demo-banner strong { font-weight: 700; }
  .demo-signup-btn {
    background: var(--accent); color: #0e0e10; border: none;
    border-radius: 6px; padding: 5px 14px;
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    cursor: pointer; letter-spacing: .04em; transition: opacity .15s;
  }
  .demo-signup-btn:hover { opacity: .88; }

  /* ── HEADER ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 100;
  }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .header-date { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
  .user-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 20px; padding: 5px 12px 5px 6px;
    font-size: 13px; cursor: pointer; transition: border-color .15s;
    position: relative;
  }
  .user-pill:hover { border-color: rgba(255,255,255,0.22); }
  .user-avatar { font-size: 18px; line-height: 1; }
  .user-name { font-weight: 500; color: var(--text); max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* User dropdown */
  .user-dropdown {
    display: none;
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 6px;
    min-width: 160px; z-index: 200;
    animation: dropIn .15s ease;
  }
  @keyframes dropIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .user-pill:hover .user-dropdown { display: block; }
  .dd-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; padding: 8px 12px;
    font-family: 'Syne', sans-serif; font-size: 13px; color: var(--muted);
    cursor: pointer; border-radius: 7px; transition: background .1s;
  }
  .dd-item:hover { background: var(--surface); color: var(--text); }
  .dd-item.danger:hover { color: var(--red); }

  /* ── LAYOUT ── */
  .layout { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 65px); }

  /* ── LEFT PANEL ── */
  .left-panel { border-right: 1px solid var(--border); padding: 24px 22px; display: flex; flex-direction: column; gap: 20px; }
  .panel-title { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .form-group { display: flex; flex-direction: column; gap: 7px; }
  .form-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .form-input {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 10px; padding: 11px 14px;
    color: var(--text); font-family: 'Syne', sans-serif; font-size: 14px;
    outline: none; transition: border-color .15s, background .15s; width: 100%;
  }
  .form-input:focus { border-color: var(--accent); background: var(--surface2); }
  .form-input::placeholder { color: var(--muted); }

  .amount-row { position: relative; }
  .currency-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: 'DM Mono', monospace; font-size: 14px; color: var(--muted); pointer-events: none; }
  .amount-input { padding-left: 30px !important; font-family: 'DM Mono', monospace !important; font-size: 18px !important; font-weight: 500 !important; }

  .category-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .cat-btn {
    background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
    padding: 10px 6px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 5px; transition: all .15s; font-family: 'Syne', sans-serif;
  }
  .cat-btn:hover { border-color: rgba(255,255,255,0.2); background: var(--surface2); }
  .cat-btn.selected { border-color: var(--cat-color); background: var(--cat-dim); }
  .cat-icon { font-size: 18px; }
  .cat-label { font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
  .cat-btn.selected .cat-label { color: var(--cat-color); }

  /* AI hint */
  .ai-hint {
    display: none; align-items: center; gap: 8px;
    background: var(--accent-dim); border: 1px solid rgba(200,240,96,0.25);
    border-radius: 8px; padding: 9px 12px; font-size: 12px; color: var(--accent);
  }
  .ai-hint.visible { display: flex; }
  .ai-hint-text { flex: 1; line-height: 1.4; }
  .ai-hint-apply {
    background: var(--accent); color: #0e0e10; border: none;
    border-radius: 6px; padding: 4px 10px; font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase;
    letter-spacing: .04em; flex-shrink: 0;
  }

  .add-btn {
    background: var(--accent); color: #0e0e10; border: none;
    border-radius: 10px; padding: 14px; font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; text-transform: uppercase;
    transition: opacity .15s, transform .1s; margin-top: 4px;
  }
  .add-btn:hover { opacity: .9; }
  .add-btn:active { transform: scale(.98); }

  /* ── SUMMARY STRIP ── */
  .summary-strip { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; padding: 20px; border-bottom: 1px solid var(--border); }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .summary-label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
  .summary-value { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text); }
  .summary-value.accent { color: var(--accent); }

  /* Budget warning */
  .budget-bar-wrap { padding: 12px 20px; border-bottom: 1px solid var(--border); display: none; }
  .budget-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .budget-bar-track { background: var(--surface2); border-radius: 4px; height: 5px; }
  .budget-bar-fill { height: 100%; border-radius: 4px; transition: width .5s; }

  /* ── RIGHT PANEL ── */
  .right-panel { display: flex; flex-direction: column; }

  .filter-bar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 20px; padding: 5px 14px;
    font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .expense-list { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .expense-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); animation: slideIn .2s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .expense-item:last-child { border-bottom: none; }
  .expense-dot { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .expense-info { flex: 1; }
  .expense-name { font-size: 14px; font-weight: 600; }
  .expense-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
  .expense-cat-tag { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
  .expense-amount { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; flex-shrink: 0; }
  .delete-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; padding: 4px 6px; border-radius: 6px; transition: all .15s; flex-shrink: 0; line-height: 1; }
  .delete-btn:hover { color: var(--red); background: var(--red-dim); }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; text-align: center; }
  .empty-icon { font-size: 48px; opacity: .3; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--muted); }
  .empty-sub { font-size: 13px; color: var(--muted); opacity: .7; }

  /* Chart */
  .chart-row { border-top: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .chart-title { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-name { font-size: 12px; color: var(--muted); width: 90px; flex-shrink: 0; font-weight: 500; }
  .bar-track { flex: 1; background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .bar-amount { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); width: 70px; text-align: right; flex-shrink: 0; }

  /* ── MISMATCH MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.visible { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 28px; width: 360px; max-width: 90vw; animation: modalIn .2s cubic-bezier(.4,0,.2,1); }
  @keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
  .modal-icon { font-size: 28px; margin-bottom: 12px; }
  .modal-title-m { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .modal-body { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .modal-body strong { color: var(--text); font-weight: 600; }
  .modal-cats { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .modal-cat-pill { display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; border: 1px solid; }
  .modal-arrow { color: var(--muted); font-size: 18px; }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }
  .modal-btn { border-radius: 10px; padding: 12px 16px; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s; }
  .modal-btn.primary { background: var(--accent); color: #0e0e10; }
  .modal-btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
  .modal-btn:hover { opacity: .88; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text); transform: translateY(80px); opacity: 0; transition: all .25s cubic-bezier(.4,0,.2,1); z-index: 999; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .left-panel { border-right: none; border-bottom: 1px solid var(--border); }
    .summary-strip { grid-template-columns: repeat(3,1fr); padding: 14px; }
    .summary-value { font-size: 16px; }
    .header { padding: 14px 16px; }
    .header-date { display: none; }
  }
</style>
</head>
<body>

<!-- SESSION CHECK: runs before render -->
<script>
const _profile = JSON.parse(localStorage.getItem('kharcha_profile') || 'null');
const _isDemo  = localStorage.getItem('kharcha_demo') === '1';
if (!_profile && !_isDemo) window.location.href = 'index.html';
</script>

<!-- DEMO BANNER (shown only in demo mode) -->
<div class="demo-banner" id="demoBanner" style="display:none">
  <span>👀 You're in <strong>demo mode</strong> — expenses won't be saved.</span>
  <button class="demo-signup-btn" onclick="window.location.href='index.html'">Create free account →</button>
</div>

<!-- HEADER -->
<header class="header">
  <div class="logo">khar<span>cha</span></div>
  <div class="header-right">
    <div class="header-date" id="headerDate"></div>
    <div class="user-pill" id="userPill">
      <span class="user-avatar" id="userAvatar">😎</span>
      <span class="user-name" id="userName">Demo</span>
      <div class="user-dropdown" id="userDropdown">
        <button class="dd-item" onclick="window.location.href='index.html'">🏠 Home</button>
        <button class="dd-item danger" onclick="signOut()">🚪 Sign out</button>
      </div>
    </div>
  </div>
</header>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT: Add expense -->
  <aside class="left-panel">
    <p class="panel-title">Add expense</p>

    <div class="form-group">
      <label class="form-label">Category</label>
      <div class="category-grid" id="categoryGrid">
        <button class="cat-btn selected" data-cat="Food" style="--cat-color:var(--food);--cat-dim:var(--food-dim)">
          <span class="cat-icon">🍜</span><span class="cat-label">Food</span>
        </button>
        <button class="cat-btn" data-cat="Transport" style="--cat-color:var(--transport);--cat-dim:var(--transport-dim)">
          <span class="cat-icon">🚗</span><span class="cat-label">Transport</span>
        </button>
        <button class="cat-btn" data-cat="Shopping" style="--cat-color:var(--shopping);--cat-dim:var(--shopping-dim)">
          <span class="cat-icon">🛍️</span><span class="cat-label">Shopping</span>
        </button>
        <button class="cat-btn" data-cat="Health" style="--cat-color:var(--health);--cat-dim:var(--health-dim)">
          <span class="cat-icon">💊</span><span class="cat-label">Health</span>
        </button>
        <button class="cat-btn" data-cat="Entertainment" style="--cat-color:var(--entertainment);--cat-dim:var(--entertainment-dim)">
          <span class="cat-icon">🎬</span><span class="cat-label">Fun</span>
        </button>
        <button class="cat-btn" data-cat="Other" style="--cat-color:var(--other);--cat-dim:var(--other-dim)">
          <span class="cat-icon">📦</span><span class="cat-label">Other</span>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">What did you spend on?</label>
      <input class="form-input" id="expenseName" type="text" placeholder="e.g. Coffee, Groceries…" maxlength="40">
    </div>

    <div class="ai-hint" id="aiHint">
      <span>✦</span>
      <span class="ai-hint-text" id="aiHintText"></span>
      <button class="ai-hint-apply" id="aiHintApply">Switch</button>
    </div>

    <div class="form-group">
      <label class="form-label">Amount</label>
      <div class="amount-row">
        <span class="currency-prefix">₹</span>
        <input class="form-input amount-input" id="expenseAmount" type="number" placeholder="0" min="0" step="any">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Date</label>
      <input class="form-input" id="expenseDate" type="date">
    </div>

    <button class="add-btn" id="addBtn">+ Add expense</button>
  </aside>

  <!-- RIGHT: Summary + list -->
  <main class="right-panel">

    <div class="summary-strip">
      <div class="summary-card">
        <div class="summary-label">Total spent</div>
        <div class="summary-value accent" id="totalSpent">₹0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">This month</div>
        <div class="summary-value" id="monthSpent">₹0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Transactions</div>
        <div class="summary-value" id="txCount">0</div>
      </div>
    </div>

    <!-- Budget progress bar (shown if user set a budget) -->
    <div class="budget-bar-wrap" id="budgetWrap">
      <div class="budget-bar-label">
        <span>Monthly budget</span>
        <span id="budgetLabel"></span>
      </div>
      <div class="budget-bar-track">
        <div class="budget-bar-fill" id="budgetFill"></div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Food">Food</button>
      <button class="filter-btn" data-filter="Transport">Transport</button>
      <button class="filter-btn" data-filter="Shopping">Shopping</button>
      <button class="filter-btn" data-filter="Health">Health</button>
      <button class="filter-btn" data-filter="Entertainment">Fun</button>
      <button class="filter-btn" data-filter="Other">Other</button>
    </div>

    <div class="expense-list" id="expenseList"></div>

    <div class="chart-row" id="chartRow" style="display:none">
      <div class="chart-title">Spending breakdown</div>
      <div id="chartBars"></div>
    </div>

  </main>
</div>

<!-- MISMATCH MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title-m" id="modalTitle">Category mismatch</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-cats" id="modalCats"></div>
    <div class="modal-actions">
      <button class="modal-btn primary" id="modalSwitch"></button>
      <button class="modal-btn secondary" id="modalKeep"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── SESSION ── */
const profile = JSON.parse(localStorage.getItem('kharcha_profile') || 'null');
const isDemo  = localStorage.getItem('kharcha_demo') === '1';

// Show demo banner
if (isDemo) document.getElementById('demoBanner').style.display = 'flex';

// Set header user info
if (profile) {
  document.getElementById('userAvatar').textContent = profile.avatar || '😎';
  document.getElementById('userName').textContent   = profile.name;
} else {
  document.getElementById('userAvatar').textContent = '👀';
  document.getElementById('userName').textContent   = 'Demo';
}

function signOut() {
  localStorage.removeItem('kharcha_demo');
  window.location.href = 'index.html';
}

/* ── CAT META ── */
const CAT_META = {
  Food:          { icon:'🍜', color:'#c8f060' },
  Transport:     { icon:'🚗', color:'#60c8f0' },
  Shopping:      { icon:'🛍️', color:'#f0a060' },
  Health:        { icon:'💊', color:'#c060f0' },
  Entertainment: { icon:'🎬', color:'#f060a0' },
  Other:         { icon:'📦', color:'#808090' },
};

const CAT_RULES = {
  Food: ['coffee','tea','chai','latte','cappuccino','espresso','breakfast','lunch','dinner','snack','meal','food','eat','zomato','swiggy','restaurant','cafe','pizza','burger','biryani','dosa','idli','thali','grocery','groceries','vegetable','fruit','milk','bread','rice','dal','juice','biscuit','chocolate','candy','ice cream','maggi','noodles','water bottle'],
  Transport: ['uber','ola','rapido','cab','taxi','auto','rickshaw','bus','metro','train','flight','petrol','fuel','diesel','toll','parking','bike','scooter','yulu'],
  Shopping: ['amazon','flipkart','myntra','meesho','clothes','shirt','shoes','jeans','dress','bag','wallet','electronics','mobile','laptop','headphones','watch','book','stationery','pen','notebook'],
  Health: ['medicine','doctor','hospital','clinic','pharmacy','chemist','checkup','gym','yoga','protein','supplement','dental','eye','spectacles','apollo','medplus'],
  Entertainment: ['movie','cinema','netflix','spotify','hotstar','prime','theatre','concert','game','pubg','steam','bowling','cricket','football','ticket','party','club','bar'],
};

function suggestCategory(name) {
  const lower = name.toLowerCase();
  for (const [cat, keywords] of Object.entries(CAT_RULES)) {
    if (keywords.some(k => lower.includes(k))) return cat;
  }
  return null;
}

/* ── STATE ── */
// In demo mode: use a temporary in-memory array seeded with sample data
// In real mode: use localStorage keyed per user
let expenses = [];
let selectedCat = 'Food';
let activeFilter = 'All';
let pendingExpense = null;

const STORAGE_KEY = profile ? 'kharcha_v1_' + profile.name.toLowerCase().replace(/\s/g,'_') : null;

function loadExpenses() {
  if (isDemo) {
    const today     = new Date().toISOString().split('T')[0];
    const yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0];
    return [
      { id:1, name:'Zomato order',        amount:320,  cat:'Food',          date:today },
      { id:2, name:'Uber to office',       amount:180,  cat:'Transport',     date:today },
      { id:3, name:'Grocery run',          amount:1240, cat:'Shopping',      date:yesterday },
      { id:4, name:'Coffee — Third Wave',  amount:220,  cat:'Food',          date:yesterday },
      { id:5, name:'Movie tickets',        amount:600,  cat:'Entertainment', date:yesterday },
    ];
  }
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}

function save() {
  if (!isDemo && STORAGE_KEY) localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  // demo: no save — intentional
}

expenses = loadExpenses();

/* ── INIT ── */
document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];
document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

/* ── CATEGORY SELECT ── */
document.getElementById('categoryGrid').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedCat = btn.dataset.cat;
  const name = document.getElementById('expenseName').value.trim();
  if (name) checkHint(name);
});

/* ── AI HINT ── */
document.getElementById('expenseName').addEventListener('input', e => checkHint(e.target.value.trim()));

function checkHint(name) {
  const hint = document.getElementById('aiHint');
  if (!name) { hint.classList.remove('visible'); return; }
  const suggested = suggestCategory(name);
  if (suggested && suggested !== selectedCat) {
    const m = CAT_META[suggested];
    document.getElementById('aiHintText').textContent =
      '"' + name + '" looks like ' + m.icon + ' ' + suggested + ' — not ' + CAT_META[selectedCat].icon + ' ' + selectedCat;
    hint.classList.add('visible');
    document.getElementById('aiHintApply').onclick = () => { switchCategory(suggested); hint.classList.remove('visible'); };
  } else {
    hint.classList.remove('visible');
  }
}

function switchCategory(cat) {
  selectedCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('selected', b.dataset.cat === cat));
}

/* ── FILTERS ── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderList();
  });
});

/* ── ADD EXPENSE ── */
document.getElementById('addBtn').addEventListener('click', addExpense);
document.getElementById('expenseName').addEventListener('keydown', e => { if(e.key==='Enter') addExpense(); });
document.getElementById('expenseAmount').addEventListener('keydown', e => { if(e.key==='Enter') addExpense(); });

function addExpense() {
  if (isDemo) { showToast('Create an account to save expenses!'); return; }
  const name   = document.getElementById('expenseName').value.trim();
  const amount = parseFloat(document.getElementById('expenseAmount').value);
  const date   = document.getElementById('expenseDate').value;
  if (!name)              { shake('expenseName');  showToast('Add a description'); return; }
  if (!amount || amount <= 0) { shake('expenseAmount'); showToast('Enter a valid amount'); return; }
  const suggested = suggestCategory(name);
  if (suggested && suggested !== selectedCat) {
    pendingExpense = { name, amount, date };
    showMismatchModal(name, selectedCat, suggested);
    return;
  }
  commitExpense(name, amount, selectedCat, date);
}

function showMismatchModal(name, userCat, aiCat) {
  const mu = CAT_META[userCat], ma = CAT_META[aiCat];
  document.getElementById('modalTitle').textContent = 'Heads up — category mismatch';
  document.getElementById('modalBody').innerHTML =
    'You selected <strong>' + mu.icon + ' ' + userCat + '</strong>, but <strong>"' + name + '"</strong> looks more like <strong>' + ma.icon + ' ' + aiCat + '</strong>.<br><br>Which category should this be saved under?';
  document.getElementById('modalCats').innerHTML =
    '<div class="modal-cat-pill" style="background:' + mu.color + '18;border-color:' + mu.color + '44;color:' + mu.color + '">' + mu.icon + ' ' + userCat + '</div>' +
    '<div class="modal-arrow">→</div>' +
    '<div class="modal-cat-pill" style="background:' + ma.color + '18;border-color:' + ma.color + '55;color:' + ma.color + '">' + ma.icon + ' ' + aiCat + '</div>';
  document.getElementById('modalSwitch').textContent = 'Use ' + ma.icon + ' ' + aiCat + ' (recommended)';
  document.getElementById('modalKeep').textContent   = 'Keep ' + mu.icon + ' ' + userCat + ' (my choice)';
  document.getElementById('modalSwitch').onclick = () => { switchCategory(aiCat); closeModal(); commitExpense(pendingExpense.name, pendingExpense.amount, aiCat, pendingExpense.date); };
  document.getElementById('modalKeep').onclick   = () => { closeModal(); commitExpense(pendingExpense.name, pendingExpense.amount, userCat, pendingExpense.date); };
  document.getElementById('modalOverlay').classList.add('visible');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('visible'); pendingExpense = null; }
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===document.getElementById('modalOverlay')) closeModal(); });

function commitExpense(name, amount, cat, date) {
  expenses.unshift({ id: Date.now(), name, amount, cat, date });
  save();
  document.getElementById('expenseName').value  = '';
  document.getElementById('expenseAmount').value = '';
  document.getElementById('aiHint').classList.remove('visible');
  renderAll();
  showToast('Expense added ✓');
}

function deleteExpense(id) {
  if (isDemo) { showToast('Create an account to manage expenses!'); return; }
  expenses = expenses.filter(e => e.id !== id);
  save(); renderAll();
}

/* ── RENDER ── */
function fmt(n) { return '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:0}); }
function renderAll() { renderList(); renderSummary(); renderChart(); renderBudget(); }

function renderList() {
  const list = document.getElementById('expenseList');
  const filtered = activeFilter === 'All' ? expenses : expenses.filter(e => e.cat === activeFilter);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">💸</div><div class="empty-title">No expenses yet</div><div class="empty-sub">' + (isDemo ? 'Demo is empty for this filter.' : 'Add your first one on the left.') + '</div></div>';
    return;
  }
  list.innerHTML = filtered.map(e => {
    const m = CAT_META[e.cat] || CAT_META.Other;
    const d = e.date ? new Date(e.date + 'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
    return '<div class="expense-item">' +
      '<div class="expense-dot" style="background:' + m.color + '22">' + m.icon + '</div>' +
      '<div class="expense-info"><div class="expense-name">' + esc(e.name) + '</div>' +
        '<div class="expense-meta"><span class="expense-cat-tag" style="background:' + m.color + '22;color:' + m.color + '">' + e.cat + '</span>' +
        (d ? '<span>' + d + '</span>' : '') + '</div></div>' +
      '<div class="expense-amount">' + fmt(e.amount) + '</div>' +
      '<button class="delete-btn" onclick="deleteExpense(' + e.id + ')">×</button></div>';
  }).join('');
}

function renderSummary() {
  const total = expenses.reduce((s,e) => s+e.amount, 0);
  const now = new Date();
  const month = expenses.filter(e => { if(!e.date) return false; const d=new Date(e.date+'T00:00'); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); }).reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalSpent').textContent = fmt(total);
  document.getElementById('monthSpent').textContent = fmt(month);
  document.getElementById('txCount').textContent = expenses.length;
}

function renderBudget() {
  if (!profile || !profile.budget) return;
  const wrap = document.getElementById('budgetWrap');
  const now = new Date();
  const monthSpent = expenses.filter(e => { if(!e.date) return false; const d=new Date(e.date+'T00:00'); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); }).reduce((s,e)=>s+e.amount,0);
  const pct = Math.min((monthSpent / profile.budget) * 100, 100);
  const color = pct < 70 ? '#c8f060' : pct < 90 ? '#f0a060' : '#ff5f5f';
  wrap.style.display = 'block';
  document.getElementById('budgetLabel').textContent = fmt(monthSpent) + ' / ' + fmt(profile.budget);
  document.getElementById('budgetFill').style.cssText = 'width:' + pct + '%;background:' + color;
  if (pct >= 90) showToast('⚠️ You\'ve used ' + Math.round(pct) + '% of your monthly budget!');
}

function renderChart() {
  const chartRow = document.getElementById('chartRow');
  if (!expenses.length) { chartRow.style.display='none'; return; }
  chartRow.style.display='flex';
  const totals = {};
  expenses.forEach(e => { totals[e.cat] = (totals[e.cat]||0) + e.amount; });
  const max = Math.max(...Object.values(totals));
  document.getElementById('chartBars').innerHTML = Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([cat,amt]) => {
    const m = CAT_META[cat] || CAT_META.Other;
    const pct = max > 0 ? (amt/max*100).toFixed(1) : 0;
    return '<div class="bar-row"><div class="bar-name">' + m.icon + ' ' + cat + '</div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + m.color + '"></div></div><div class="bar-amount">' + fmt(amt) + '</div></div>';
  }).join('');
}

function shake(id) { const el=document.getElementById(id); el.style.borderColor='var(--red)'; setTimeout(()=>{el.style.borderColor='';},1000); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

renderAll();
</script>
</body>
</html>
